# Service ID
set_charge_rate:
  # Service name as shown in UI
  name: Set maximum charge rate
  # Description of the service
  description: Sets the maximum charge rate in Amps or Watts (dependent on charger support)
  # If the service accepts entity IDs, target allows the user to specify entities by entity, device, or area. If `target` is specified, `entity_id` should not be defined in the `fields` map. By default it shows only targets matching entities from the same domain as the service, but if further customization is required, target supports the entity, device, and area selectors (https://www.home-assistant.io/docs/blueprint/selectors/). Entity selector parameters will automatically be applied to device and area, and device selector parameters will automatically be applied to area.
  #target:
  #   entity:
  #     integration: ocpp
  # Different fields that your service accepts
  fields:
    # Key of the field
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    limit_amps:
      # Field name as shown in UI
      name: Limit (A)
      # Description of the field
      description: Maximum charge rate in Amps (optional)
      # Whether or not field is required (default = false)
      required: false
      # Advanced fields are only shown when the advanced mode is enabled for the user (default = false)
      advanced: false
      # Example value that can be passed for this field
      example: 16
      # The default field value
      default: 32
    limit_watts:
      name: Limit (W)
      description: Maximum charge rate in Watts (optional)
      required: false
      advanced: true
      example: 1500
      default: 22000
    conn_id:
      name: Connector identifier
      description: Selects the target connector, or mapped EVSE on OCPP 2.x, for custom_profile. Managed limits first target the whole charging station; OCPP 1.6 may use this connector for fallback profiles.
      required: false
      advanced: true
      example: 0
      default: 0
    custom_profile:
      name: Custom profile
      description: Raw OCPP charging profile. Prefer a YAML mapping, including a template that returns a mapping. A valid JSON object string is also accepted; single-quoted object strings remain supported for compatibility.
      required: false
      advanced: true
      example: '{"chargingProfileId":8,"stackLevel":0,"chargingProfileKind":"Relative","chargingProfilePurpose":"ChargePointMaxProfile","chargingSchedule":{"chargingRateUnit":"A","chargingSchedulePeriod":[{"startPeriod":0,"limit":16}]}}'

trigger_custom_message:
  name: Trigger Message
  description: Request a specific message from the charger
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    requested_message:
      name: Requested Message
      description: Message Requested from the charger
      required: true
      advanced: true
      example: "StatusNotification"

clear_profile:
  name: Clear charging profiles
  description: Clears all charging profiles (limits) set (dependent on charger support)
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
    conn_id:
      name: Connector id
      description: Limit the clear to a single connector. Only effective on OCPP 1.6; on OCPP 2.0.1 the clear always applies station-wide
      required: false
      advanced: true
      example: 1

update_firmware:
  name: Update charger firmware
  description: Specify server to download firmware and time to delay updating (dependent on charger support), supported transfer protocols can be requested by the configuration key SupportedFileTransferProtocols
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    firmware_url:
      name: Url of firmware
      description: Full url of firmware file (http or https)
      required: true
      advanced: true
      example: "http://www.charger.com/firmware.bin"
    delay_hours:
      name: Delay hours
      description: Hours to delay charger update
      required: false
      advanced: true
      example: 12
      default: 0

configure:
  name: Configure charger features
  description: Change supported Ocpp configuration values
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    ocpp_key:
      name: Write-enabled configuration key name
      description: v1.6- Key name supported v2.0.1- Component name/Key name
      required: true
      advanced: true
      example: "WebSocketPingInterval"
    value:
      name: Key value
      description: Value to write to key
      required: true
      advanced: true
      example: "60"

get_configuration:
  name: Get configuration values for charger
  description: Get supported Ocpp configuration values
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    ocpp_key:
      name: Configuration key name
      description: v1.6- Key name v2.0.1- Component name/Key name. Leave empty to retrieve all configuration keys (v1.6 only).
      required: false
      advanced: true
      example: "WebSocketPingInterval"

get_diagnostics:
  name: Request diagnostic data from charger
  description: Specify server url to upload diagnostic data to (dependent on charger support), supported transfer protocols can be requested by the configuration key SupportedFileTransferProtocols
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    upload_url:
      name: Url for upload
      description: Full url to upload to
      required: true
      advanced: true
      example: "https://webhook.site/abc"

data_transfer:
  name: Request data transfer from charger
  description: Note this is specific to charger, see manufacturer's documentation
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    vendor_id:
      name: vendorId
      description: Defined by charger manufacturer
      required: true
      advanced: true
      example: "ABC"
    message_id:
      name: messageId
      description: Defined by charger manufacturer
      required: false
      advanced: true
      example: "ABC"
    data:
      name: data
      description: Defined by charger manufacturer
      required: false
      advanced: true
      example: "ABC"

run_conformance:
  name: Run OCPP 1.6 conformance test
  description: >-
    Sends every CSMS-initiated OCPP 1.6J operation to a connected charger,
    checks what the charger sends back and writes a report to
    <config>/ocpp_conformance/. Diagnostic aid, not a certification.
  fields:
    devid:
      name: Charger identifier
      description: Either HA charger id or Ocpp id
      required: false
      advanced: true
      example: charger
    level:
      name: Level
      description: safe = read-only checks; intrusive = also changes state temporarily (availability, reservation, charging profile, local list, remote start/stop, unlock); disruptive = also Reset and UpdateFirmware
      required: false
      default: safe
      selector:
        select:
          options:
            - safe
            - intrusive
            - disruptive
    connector:
      name: Connector
      description: Connector used for connector-scoped tests
      required: false
      advanced: true
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    diagnostics_url:
      name: Diagnostics upload url
      description: Needed to test GetDiagnostics (otherwise skipped)
      required: false
      advanced: true
      example: "ftp://user:pass@host/diag"
    firmware_url:
      name: Firmware url
      description: Needed to test UpdateFirmware at level disruptive (otherwise skipped)
      required: false
      advanced: true
      example: "http://host/firmware.bin"
    message_timeout:
      name: Message timeout (s)
      description: How long to wait for a message the charger should send after a request (e.g. after TriggerMessage)
      required: false
      advanced: true
      default: 15
      selector:
        number:
          min: 1
          max: 300
          mode: box
    wait:
      name: Wait for the result
      description: Keep the action open until the test finishes and return the report. Otherwise it runs in the background and the result is published as the ocpp_conformance event and a notification.
      required: false
      default: false
      selector:
        boolean:
